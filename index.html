<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقشه‌یاب هوشمند</title>

    <link rel="stylesheet" href="assets/fonts/vazir.css">
    <link rel="stylesheet" href="assets/css/leaflet.css">
    <link rel="stylesheet" href="assets/css/persian-datepicker.min.css">

    <style>
        :root {
            --bg-color: #f9fafb; --container-bg: #ffffff; --border-color: #e5e7eb; --text-primary: #1f2937;
            --text-secondary: #6b7280; --accent-color: #3b82f6; --accent-color-dark: #2563eb;
            --font-family: 'Vazir', sans-serif; --border-radius: 12px; --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--text-primary); margin: 0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; line-height: 1.8; -webkit-font-smoothing: antialiased; }
        .container { width: 100%; max-width: 800px; text-align: right; }
        .header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 2.8em; font-weight: 800; }
        .header p { font-size: 1.1em; color: var(--text-secondary); margin-top: 10px; }
        #addressInput { width: 100%; padding: 16px 20px; border: 2px solid var(--border-color); border-radius: var(--border-radius); font-size: 1.1em; background-color: var(--container-bg); color: var(--text-primary); transition: all 0.3s ease; box-sizing: border-box; margin-bottom: 15px; }
        #searchButton { width: 100%; padding: 16px; background-image: linear-gradient(45deg, var(--accent-color), var(--accent-color-dark)); color: #ffffff; border: none; border-radius: var(--border-radius); cursor: pointer; font-size: 1.2em; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 20px rgba(59, 130, 246, 0.2); }
        #searchButton:hover { transform: translateY(-3px); }
        #searchButton:disabled { background: var(--border-color); cursor: not-allowed; transform:none; box-shadow: none; }
        .spinner { width: 24px; height: 24px; border: 3px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: #ffffff; animation: spin 1s ease-in-out infinite; display: none; }
        #searchButton:disabled .spinner { display: block; }
        #searchButton:disabled #searchButtonText { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #modalContainer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(31, 41, 55, 0.5); display: none; align-items: center; justify-content: center; z-index: 2000; opacity: 0; transition: opacity 0.3s ease; }
        #modalContainer.visible { display: flex; opacity: 1; }
        .modal-content { background: var(--container-bg); padding: 30px; border-radius: var(--border-radius); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); text-align: center; max-width: 400px; width: 90%; }
        .modal-buttons { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .modal-button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 1.1em; font-weight: 600; cursor: pointer; }
        #searchApproximateBtn { background-color: var(--accent-color); color: white; }
        #searchExactBtn { background-color: #f3f4f6; color: var(--text-primary); border: 1px solid var(--border-color); }
        .error-message { padding: 15px; border-radius: var(--border-radius); background-color: #fef2f2; color: #ef4444; text-align: center; font-weight: 500; margin-top: 20px; border: 1px solid #fca5a5; display: none; }
        #resultsGrid { display: none; grid-template-columns: 1fr; gap: 1rem; margin-top: 40px; }
        .grid-card { display: none; background-color: var(--container-bg); border: 1px solid var(--border-color); border-radius: var(--border-radius); padding: 20px; box-shadow: var(--shadow-md); }
        #mapCard { padding: 0; overflow: hidden; height: 400px; }
        #map { height: 100%; width: 100%; z-index: 1; cursor: pointer;}
        .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .card-header svg { width: 20px; height: 20px; color: var(--accent-color); }
        .card-header h3 { margin: 0; font-size: 1.1em; font-weight: 600; }
        #foundTitle { font-size: 1.4em; font-weight: 800; }
        .main-result-address { font-size: 0.85em; color: var(--text-secondary); line-height: 1.7; margin-bottom: 1.5rem; }
        #detailsContainer { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem; }
        .detail-item { display: flex; align-items: center; justify-content: space-between; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--border-radius); padding: 12px 15px; }
        .detail-item-content { display: flex; flex-direction: column; }
        .detail-item-label { font-size: 0.75em; color: var(--text-secondary); margin-bottom: 2px; }
        .detail-item-value { font-size: 0.95em; font-weight: 700; }
        .coord-value { direction: ltr; }
        .copy-button { background-color: transparent; border: 1px solid transparent; color: var(--text-secondary); padding: 8px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
        .copy-button svg { width: 16px; height: 16px; }
        .links-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .action-link { display: flex; align-items: center; justify-content: center; padding: 12px 15px; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--border-radius); text-decoration: none; color: var(--text-primary); }
        .item-list { list-style-type: none; padding: 0; margin-top: 15px; max-height: 0; overflow-y: auto; transition: max-height 0.5s ease-in-out; }
        .grid-card.open .item-list { max-height: 1000px; }
        .item-list li { padding: 12px 15px; border-radius: 8px; cursor: pointer; margin-bottom: 8px; background-color: var(--bg-color); border: 1px solid var(--border-color); position: relative; display: flex; justify-content: space-between; align-items: center;}
        .list-item-details { font-size: 0.8em; color: var(--text-secondary); margin-top: 4px; display: block; }
        .report-actions { display: flex; gap: 10px; align-items: center; }
        .delete-report-btn { background-color: #fee2e2; color: #ef4444; border: none; padding: 4px 10px; font-size: 0.9em; border-radius: 6px; cursor: pointer; white-space: nowrap; }
        .pending-status-text { background-color: #fef3c7; color: #d97706; border:none; padding: 4px 10px; font-size: 0.9em; border-radius: 6px; white-space: nowrap; }
        #toggle-button { width: 100%; margin-top: 15px; padding: 10px 15px; background: transparent; border: 1px solid var(--border-color); border-radius: 8px; display: flex; justify-content: center; align-items: center; gap: 8px; cursor: pointer;}
        #toggle-button svg { transition: transform 0.3s ease; }
        .grid-card.open #toggle-button svg { transform: rotate(180deg); }
        #reportFormContainer { max-height: 0; overflow: hidden; transition: max-height 0.7s ease; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .form-field select, .form-field input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit; font-size: 1em; }
        #submitReportBtn { width: 50%; margin: 10px auto 0; display: block; padding: 14px; background-color: var(--accent-color-dark); color: white; border-radius: 8px; border: none; cursor: pointer; }
        .toast-notification { position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 100px); background-color: var(--accent-color-dark); color: white; padding: 12px 24px; border-radius: 8px; z-index: 1000; opacity: 0; transition: all 0.4s; }
        .toast-notification.show { opacity: 1; transform: translate(-50%, 0); }
        .footer { text-align: center; margin-top: 50px; padding-top: 20px; width: 100%; max-width: 800px; border-top: 1px solid var(--border-color); }
        .footer .heart-icon { color: #ef4444; display: inline-block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <header class="header"><h1>نقشه‌یاب هوشمند</h1><p>آدرس, مختصات دقیق جغرافیایی یا شماره گزارش را وارد کنید</p></header>
        <div class="search-form">
            <input type="text" id="addressInput" placeholder="مثال: تهران، میدان آزادی یا 09123456789">
            <button id="searchButton"><span id="searchButtonText">جستجو</span><div class="spinner"></div></button>
        </div>
        <div id="modalContainer"></div>
        <div id="errorContainer" class="error-message"><p id="errorMessage"></p></div>
        <div id="resultsGrid">
            <div id="otherReportsCard" class="grid-card"></div>
            <div id="mainResultCard" class="grid-card"></div>
            <div id="reportCard" class="grid-card"></div>
            <div id="mapCard" class="grid-card"><div id="map"></div></div>
            <div id="mapLinksCard" class="grid-card"></div>
            <div id="similarAddressesCard" class="grid-card"></div>
            <div id="secondarySearchContainer" class="grid-card"></div>
        </div>
    </div>

    <footer class="footer"><p>طراحی و توسعه با <span class="heart-icon">❤️</span> توسط رضا عباسی</p></footer>

    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/leaflet.js"></script>
    <script src="assets/js/persian-date.min.js"></script>
    <script src="assets/js/persian-datepicker.min.js"></script>

    <script>
    $(document).ready(function() {
        const elements = { addressInput: $('#addressInput'), searchButton: $('#searchButton'), resultsGrid: $('#resultsGrid'), errorContainer: $('#errorContainer'), errorMessage: $('#errorMessage'), mainResultCard: $('#mainResultCard'), mapLinksCard: $('#mapLinksCard'), mapCard: $('#mapCard'), mapDiv: document.getElementById('map'), reportCard: $('#reportCard'), otherReportsCard: $('#otherReportsCard'), similarAddressesCard: $('#similarAddressesCard'), secondarySearchContainer: $('#secondarySearchContainer'), modalContainer: $('#modalContainer') };
        let map, marker, isMapInit = false;
        const iranianProvinces = ['آذربایجان شرقی', 'آذربایجان غربی', 'اردبیل', 'اصفهان', 'البرز', 'ایلام', 'بوشهر', 'تهران', 'چهارمحال و بختیاری', 'خراسان جنوبی', 'خراسان رضوی', 'خراسان شمالی', 'خوزستان', 'زنجان', 'سمنان', 'سیستان و بلوچستان', 'فارس', 'قزوین', 'قم', 'کردستان', 'کرمان', 'کرمانشاه', 'کهگیلویه و بویراحمد', 'گلستان', 'گیلان', 'لرستان', 'مازندران', 'مرکزی', 'هرمزگان', 'همدان', 'یزد'].sort();

        elements.searchButton.on('click', handleSearch);
        elements.addressInput.on('keypress', e => { if (e.key === 'Enter') handleSearch(); });
        elements.modalContainer.on('click', '#searchApproximateBtn', () => performApiSearch('search'));
        elements.modalContainer.on('click', '#searchExactBtn', () => performApiSearch('geocode'));
        elements.resultsGrid.on('click', '.delete-report-btn', function(e) { e.stopPropagation(); if (confirm('آیا از درخواست حذف این گزارش اطمینان دارید؟')) handleDeleteRequest($(this).data('id'), $(this)); });
        elements.resultsGrid.on('click', '#toggle-button', function() { const card = $(this).closest('.grid-card').toggleClass('open'); const list = card.find('.item-list'); list.css('max-height', card.hasClass('open') ? list[0].scrollHeight + 'px' : '0'); });
        elements.resultsGrid.on('click', '.item-list li:not(.disabled)', function() { updateUIAfterSelection($(this).data('item'), $(this).data('is-report')); });

        function handleSearch() {
            const query = elements.addressInput.val().trim(); if (!query) return showError("لطفاً یک عبارت برای جستجو وارد کنید."); hideError(); resetUI(); setLoadingState(true); try { if (/^(0)?9\d{9}$/.test(query.replace(/\s/g,''))) { findByPhone(query); } else { showModal(); setLoadingState(false); } } catch (e) { showError(e.message); setLoadingState(false); }
        }
        function showModal() {
            const modalHtml = `<div class="modal-content"><h3>نوع آدرس را مشخص کنید</h3><div class="modal-buttons"><button id="searchApproximateBtn" class="modal-button">🔎 آدرس حدودی</button><button id="searchExactBtn" class="modal-button">📍 آدرس دقیق</button></div></div>`;
            elements.modalContainer.html(modalHtml).addClass('visible');
        }
        async function performApiSearch(type) {
            elements.modalContainer.removeClass('visible'); setLoadingState(true); try { const query = elements.addressInput.val().trim(); const data = await apiCall({ action: 'neshan_proxy', type: type, query }); if (data.result?.items?.length > 0) { displayAddressResults(data.result.items); } else if (data.result?.location) { const item = { title: data.result.formatted_address || query, address: '', location: data.result.location }; displayAddressResults([item]); } else { showNoResultsFound(); } showSecondarySearchLink(query); } catch (e) { showError(e.message); } finally { setLoadingState(false); }
        }
        async function findByPhone(phone) {
            try { const data = await apiCall({ action: 'find_by_phone', phone }); if (data.results?.length > 0) { const reports = data.results.map(row => ({ id: row.id, status: row.status, title: `گزارش در: ${new persianDate(new Date(row.report_datetime)).format('YYYY/MM/DD HH:mm')}`, address: `استان: ${row.province}`, problem_types: JSON.parse(row.problem_types), location: { y: parseFloat(row.lat), x: parseFloat(row.lng) } })); displayReportResults(reports); } else { showError(`هیچ گزارشی برای شماره ${data.normalized_phone} یافت نشد.`); } } catch(e) { showError(e.message); } finally { setLoadingState(false); }
        }
        async function handleDeleteRequest(reportId, button) {
            try { const result = await apiCall({ action: 'request_delete_report', report_id: reportId }); showToast(result.message); button.parent().html('<span class="pending-status-text">در انتظار تایید</span>'); button.closest('li').addClass('disabled'); } catch (e) { showError(e.message); }
        }
        function displayAddressResults(items) {
            resetUI();
            const [firstResult, ...similarItems] = items;
            elements.resultsGrid.show().css('display', 'grid');
            updateUIAfterSelection(firstResult, false);
            buildAndShowReportCard(firstResult.location);
            if (similarItems.length > 0) { populateSimilarItems(similarItems); elements.similarAddressesCard.show(); }
            showSecondarySearchLink(elements.addressInput.val()); elements.secondarySearchContainer.show();
        }
        function displayReportResults(reports) {
            resetUI();
            elements.resultsGrid.show().css('display', 'grid');
            const [firstResult, ...otherReports] = reports;
            if (reports.length > 1) { populateOtherReports(reports); elements.otherReportsCard.show(); }
            updateUIAfterSelection(firstResult, true);
        }
        function updateUIAfterSelection(item, isReport = false) {
            updateMainResultCard(item, isReport); updateMapLinksCard(item.location); updateMap(item.location.y, item.location.x); ['mainResultCard', 'mapLinksCard', 'mapCard'].forEach(id => elements[id].show());
        }
        async function handleMapClick(lat, lng) {
             marker.setLatLng([lat, lng]);
             try { const data = await apiCall({ action: 'reverse_geocode', lat, lng }); const title = data.result?.formatted_address || `موقعیت روی نقشه`; const item = { title, address: ``, location: { y: lat, x: lng } }; displayAddressResults([item]); } catch(e) { showError(e.message); }
        }
        function initMap() { if (isMapInit) return; isMapInit = true; map = L.map(elements.mapDiv); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map); marker = L.marker([35.7, 51.4], { draggable: true }).addTo(map); map.on('click', e => handleMapClick(e.latlng.lat, e.latlng.lng)); marker.on('dragend', e => handleMapClick(e.target.getLatLng().lat, e.target.getLatLng().lng)); }
        function updateMap(lat, lng) { if (!isMapInit) initMap(); map.setView([lat, lng], 15); marker.setLatLng([lat, lng]); setTimeout(() => { if(map) map.invalidateSize() }, 100); }

        function buildAndShowReportCard(location) {
            const card = elements.reportCard;
            card.html(`<div class="card-header"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487z"/></svg><h3>ثبت گزارش برای این آدرس</h3></div><label for="toggleReportForm"><input type="checkbox" id="toggleReportForm"> می‌خواهم گزارش ثبت کنم.</label><div id="reportSubCheckboxes" style="display:none; margin-top:15px; padding-top:15px; border-top: 1px solid var(--border-color);"><p>نوع مشکل:</p><div id="problemTypeCheckboxes"><label><input type="checkbox" name="problem_type" value="زیر 24 ساعت"> زیر ۲۴ ساعت</label><label><input type="checkbox" name="problem_type" value="دانلس"> دانلس</label><label><input type="checkbox" name="problem_type" value="کامنت"> کامنت</label><label><input type="checkbox" name="problem_type" value="نمونه شماره"> نمونه شماره</label></div></div><div id="reportFormContainer"><form id="reportForm"><div class="form-grid"><div class="form-field"><label for="phoneNumber">شماره تماس</label><input type="tel" id="phoneNumber" required></div><div class="form-field"><label for="province">استان</label><select id="province" required></select></div><div class="form-field"><label for="reportDate">تاریخ (شمسی)</label><input type="text" id="reportDate" required></div><div class="form-field" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"><div><label for="reportMinute">دقیقه</label><select id="reportMinute" required></select></div><div><label for="reportHour">ساعت</label><select id="reportHour" required></select></div></div></div><input type="hidden" id="reportLat"><input type="hidden" id="reportLng"><button type="button" id="submitReportBtn">ثبت گزارش</button></form></div>`);
            card.show();

            const formElements = { toggleReport: card.find('#toggleReportform'), subCheckboxes: card.find('#reportSubCheckboxes'), problemCheckboxes: card.find('#problemTypeCheckboxes'), formContainer: card.find('#reportFormContainer'), submitBtn: card.find('#submitReportBtn'), provinceSelect: card.find('#province'), reportDate: card.find('#reportDate'), hourSelect: card.find('#reportHour'), minuteSelect: card.find('#reportMinute'), latInput: card.find('#reportLat'), lngInput: card.find('#reportLng'), form: card.find('#reportForm'), phoneInput: card.find('#phoneNumber')};

            formElements.toggleReport.on('change', function() { formElements.subCheckboxes.toggle(this.checked); if (!this.checked) { formElements.problemCheckboxes.find('input').prop('checked', false); formElements.formContainer.css('max-height', '0px'); }});
            formElements.problemCheckboxes.on('change', 'input', () => { formElements.formContainer.css('max-height', formElements.problemCheckboxes.find('input:checked').length > 0 ? formElements.formContainer[0].scrollHeight + 'px' : '0px'); });
            formElements.submitBtn.on('click', () => handleReportSubmit(formElements));

            $.each(iranianProvinces, (i, p) => formElements.provinceSelect.append(new Option(p, p)));
            formElements.reportDate.persianDatepicker({ format: 'YYYY-MM-DD', autoClose: true, observer: true, persianDigit: false });
            for (let i=0;i<24;i++) formElements.hourSelect.append(new Option(i.toString().padStart(2, '0'), i.toString().padStart(2, '0')));
            for (let i=0;i<60;i++) formElements.minuteSelect.append(new Option(i.toString().padStart(2, '0'), i.toString().padStart(2, '0')));
            formElements.latInput.val(location.y);
            formElements.lngInput.val(location.x);
        }

        async function handleReportSubmit(formElements) {
            setLoadingState(true); const pTypes = formElements.problemCheckboxes.find('input:checked').map((_, el) => el.value).get();
            if (pTypes.length === 0) { showToast('لطفا نوع مشکل را انتخاب کنید.'); return setLoadingState(false); }
            const gregorianDate = formElements.reportDate.val();
            if(!gregorianDate) { showToast('لطفا تاریخ گزارش را انتخاب کنید.'); return setLoadingState(false); }
            const rTime = `${formElements.hourSelect.val()}:${formElements.minuteSelect.val()}`;
            try {
                await apiCall({action:'submit_report', phoneNumber: formElements.phoneInput.val(), province: formElements.provinceSelect.val(), gregorianDate: gregorianDate, reportTime: rTime, problemTypes: pTypes, lat: formElements.latInput.val(), lng: formElements.lngInput.val()});
                showToast("گزارش با موفقیت ثبت شد.");
                formElements.form[0].reset();
                formElements.toggleReport.prop('checked',false).trigger('change');
            } catch(e){showError(e.message);}
            finally{setLoadingState(false);}
        }

        function updateMainResultCard(item, isReport = false) {
            let actionsHtml = '';
            if (isReport) { actionsHtml = (item.status === 'pending_deletion') ? `<div class="report-actions"><span class="pending-status-text">در انتظار تایید حذف</span></div>` : `<div class="report-actions"><button class="delete-report-btn" data-id="${item.id}">درخواست حذف</button></div>`; }
            const html = `<div class="card-header"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/></svg><h3>نتیجه اصلی</h3></div><h4>${item.title}</h4><p class="main-result-address">${item.address||''}</p><div id="detailsContainer">${[createCoordinateDetail('عرض جغرافیایی',item.location.y),createCoordinateDetail('طول جغرافیایی',item.location.x)].join('')}</div>${actionsHtml}`;
            elements.mainResultCard.html(html).find('.copy-button').on('click', function() { copyToClipboard($(this).data('value'), $(this).data('type')); });
        }
        function populateSimilarItems(items) {
            const list = items.map(i => `<li data-item='${JSON.stringify(i)}' data-is-report="false">${i.title} - ${i.address||''}</li>`).join('');
            const html = `<div class="card-header"><h3>نتایج مشابه</h3></div><button id="toggle-button"><span>نمایش ${items.length} نتیجه مشابه</span><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z"/></svg></button><ul class="item-list">${list}</ul>`;
            elements.similarAddressesCard.html(html);
        }
        function populateOtherReports(items) {
            const list = items.map(i => { let actionHtml = (i.status === 'pending_deletion') ? `<span class="pending-status-text">در انتظار تایید</span>` : `<button class="delete-report-btn" data-id="${i.id}">درخواست حذف</button>`; return `<li data-item='${JSON.stringify(i)}' data-is-report="true" class="${i.status === 'pending_deletion' ? 'disabled' : ''}"><div>${i.title}<span class="list-item-details">${i.problem_types.join(', ')}</span></div><div class="report-actions">${actionHtml}</div></li>`; }).join('');
            const html = `<div class="card-header"><h3>گزارش‌های ثبت شده برای این شماره</h3></div><ul class="item-list" style="max-height: 1000px; overflow-y: auto;">${list}</ul>`;
            elements.otherReportsCard.html(html);
        }
        function showSecondarySearchLink(query) { const html = `<div class="card-header"><h3>جستجوی بیشتر</h3></div><div class="links-grid"><a href="https://zarebin.ir/search?q=${encodeURIComponent(query)}" target="_blank" class="action-link">ذره‌بین</a><a href="https://www.google.com/search?q=${encodeURIComponent(query)}" target="_blank" class="action-link">گوگل</a></div>`; elements.secondarySearchContainer.html(html); }
        async function apiCall(body) { try { const response = await fetch('api.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); if (!response.ok) throw new Error(`خطای سرور: ${response.status}`); const data = await response.json(); if (data.status === 'error') throw new Error(data.message); return data; } catch(e) { console.error("API Call failed:", e); throw e; } }
        function createCoordinateDetail(label, value) { const fVal = parseFloat(value).toFixed(6); return `<div class="detail-item"><div class="detail-item-content"><span class="detail-item-label">${label}</span><div class="detail-item-value coord-value">${fVal}</div></div><button class="copy-button" data-value="${fVal}" data-type="${label}"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M1.5 2A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h9a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 10.5 2h-9zM1 3.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5v-9z"/><path d="M15 1.5a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0 0 1h9a.5.5 0 0 1 .5.5v9a.5.5 0 0 0 1 0v-9A.5.5 0 0 0 15 1.5z"/></svg></button></div>`; }
        function updateMapLinksCard(loc) { elements.mapLinksCard.html(`<div class="card-header"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 6.532l6 3.066m-6-3.066l-3.328 1.696a2.25 2.25 0 00-1.172 1.974v3.522c0 .83.504 1.59 1.253 1.954l4.5 2.25c.594.297 1.284.297 1.878 0l4.5-2.25a2.25 2.25 0 001.253-1.954V13.268a2.25 2.25 0 00-1.172-1.974L15 9.6M9 6.532v7.934"/></svg><h3>مشاهده روی نقشه</h3></div><div class="links-grid"><a href="https://neshan.org/maps/search/${loc.y},${loc.x}" class="action-link" target="_blank">نشان</a><a href="https://www.google.com/search/?api=1&query=${loc.y},${loc.x}" class="action-link" target="_blank">گوگل</a></div>`); }
        function copyToClipboard(text, type) { navigator.clipboard.writeText(text).then(() => showToast(`"${type}" کپی شد!`)); }
        function resetUI() { hideError(); elements.resultsGrid.hide(); $('.grid-card').hide(); }
        function setLoadingState(isLoading) { elements.searchButton.prop('disabled', isLoading); }
        function showError(msg) { elements.errorMessage.text(msg); elements.errorContainer.show(); }
        function hideError() { elements.errorContainer.hide(); }
        function showNoResultsFound() { showError("موردی با این مشخصات یافت نشد."); }
        function showToast(message) {
            $('.toast-notification').remove(); const toast = $('<div>').addClass('toast-notification').text(message); $('body').append(toast);
            setTimeout(() => toast.addClass('show'), 10); setTimeout(() => toast.removeClass('show').on('transitionend', () => toast.remove()), 3000);
        }
    });
    </script>
</body>
</html>
